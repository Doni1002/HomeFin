<style>

/* =====================================================
   GLOBAL
===================================================== */

* {

}


body {

/* =====================================================

.app {

}


/* =====================================================
   HEADER
===================================================== */

.header {

      #1976D2
    );

    white;

    20px;

}


.header-top {

  align-items:

}

.status {

}


/* =====================================================

===================================================== */

.filter-bar {

  border-radius:
    15px;

  gap:

  flex-wrap:
    wrap;

  margin-bottom:
    20px;

    );

}


select,
input {

    1px solid #CFD8DC;

    9px;

  padding:

  font-size:

}


select:focus,

/* =====================================================

button:active {

.btn-income {

.btn-expense {

}


.btn-primary {

}


.btn-secondary {

}


.btn-delete {

  color:
    #C62828;

  font-size:

}


/* =====================================================
   SUMMARY
===================================================== */

.summary {

  display:
    grid;

    repeat(
      3,

    );

  gap:

}


.card {

  background:

  border-radius:

  padding:
    20px;

  box-shadow:

}


.card-title {

    12px;

    bold;

}


.card-value {

.income {

}


.expense {

}


.balance {

}


/* =====================================================
   SECTION
===================================================== */

.section {

  background:
    white;

  margin-top:
    20px;

  border-radius:
    16px;

  padding:
    20px;

  box-shadow:
    0 2px 8px

      0,
      0,

    );

}


.section-header {

  display:
    flex;

  align-items:

  margin-bottom:

}


.section-title {

}


/* =====================================================

===================================================== */

.transaction {

  align-items:
    center;

}


.transaction:last-child {

}


.transaction-left {

}


.transaction-title {

  font-weight:
    bold;

  margin-bottom:
    5px;

  word-break:
    break-word;

}


.transaction-meta {

  font-size:
    12px;

    #90A4AE;

}


.transaction-right {

  text-align:

  margin-left:
    15px;

}


.transaction-amount {

  font-weight:
    bold;

  margin-bottom:
    5px;

}


.transaction-income {

    #2E7D32;

}


.transaction-expense {

  color:
    #C62828;

}


.empty {

  text-align:
    center;

  padding:
    40px 20px;

  color:
    #90A4AE;

}


/* =====================================================
   MODAL
===================================================== */

.modal {

  display:
    none;

  position:
    fixed;

  inset:
    0;

  background:
    rgba(
      0,
      0,
      0,
      .5
    );

  z-index:
    1000;

  padding:
    20px;

  overflow:
    auto;

}


.modal.show {

  display:
    block;

}


.modal-content {

  background:
    white;

  width:
    100%;

  max-width:
    500px;

  margin:
    20px auto;

  padding:
    22px;

  border-radius:
    18px;

}


.modal-header {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom:
    20px;

}


.modal-title {

  font-size:
    20px;

  font-weight:
    bold;

}


.close {

  background:
    #ECEFF1;

  width:
    35px;

    50%;

  padding:
    0;

  font-size:
    20px;

}


.form-group {

    15px;

}


.form-group label {

  display:
    block;

  font-size:
    13px;

  font-weight:
    bold;

  margin-bottom:
    6px;

}


.form-group input,
.form-group select {

  width:
    100%;

}


.form-buttons {

  display:
    flex;

  gap:
    10px;

  margin-top:
    20px;

}


.form-buttons button {

  flex:
    1;

}


/* =====================================================
   LOADING
===================================================== */

.loading {

  text-align:
    center;

  padding:
    30px;

  color:
    #78909C;

}


/* =====================================================
   TOAST
===================================================== */

.toast {

  position:
    fixed;

  bottom:
    20px;

  left:
    50%;

  transform:
    translateX(-50%);

  background:
    #263238;

  color:
    white;

  padding:
    12px 18px;

  border-radius:
    10px;

  font-size:
    13px;

  display:
    none;

  z-index:
    2000;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
  max-width: 700px
) {

  .app {

    padding:
      12px;

  }


  .header {

    padding:
      20px;

  }


  .header-top {

    align-items:
      flex-start;

  }


  .header h1 {

    font-size:
      24px;

  }


  .summary {

    grid-template-columns:
      1fr;

  }

  }


  .filter-bar select,

    width:
      100%;

  }

    align-items:
      flex-start;

  }

    max-width:
      45%;

  }


  .transaction-amount {

      13px;

  }

}

</style>

<body>

<script>


/* =====================================================
   CONFIGURATION
===================================================== */

/*
 * ===================================================
 * PENTING
 *
 * GANTI URL DI BAWAH DENGAN URL WEB APP
 * GOOGLE APPS SCRIPT KAMU.
 *
 * Contoh:
 *
 * https://script.google.com/macros/s/XXXXX/exec
 * ===================================================
 */

const API_URL =
  "PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI";


/* =====================================================
   INITIALIZATION
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    initializeFilters();

    setToday();

    testConnection();

  }
);


/* =====================================================
   API GET
===================================================== */

async function apiGet(
  action,
  params = {}
) {

  const url =
    new URL(API_URL);


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(
      function(key) {

        if (
          params[key] !==
          undefined &&

          params[key] !==
          null &&

          params[key] !==
          ""
        ) {

          url.searchParams.set(
            key,
            params[key]
          );

        }

      }
    );


  const response =
    await fetch(
      url.toString(),
      {

        method:
          "GET",

        cache:
          "no-store"

      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP Error " +
      response.status
    );

  }


  return await response.json();

}


/* =====================================================
   API POST
===================================================== */

async function apiPost(
  data
) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(data)

      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP Error " +
      response.status
    );

  }


  return await response.json();

}


/* =====================================================
   TEST CONNECTION
===================================================== */

async function testConnection() {

  const status =
    document.getElementById(
      "apiStatus"
    );


  try {

    const result =
      await apiGet(
        "ping"
      );


    if (
      result.success
    ) {

      status.textContent =
        "● Connected";

      status.style.background =
        "rgba(46,125,50,.25)";


      loadDashboard();

    }

  }

  catch (error) {

    console.error(
      error
    );


    status.textContent =
      "● Offline";


    status.style.background =
      "rgba(198,40,40,.25)";


    showToast(
      "API belum terhubung."
    );

  }

}


/* =====================================================
   FILTER INITIALIZATION
===================================================== */

function initializeFilters() {

  const today =
    new Date();


  const currentMonth =
    today.getMonth() + 1;


  const currentYear =
    today.getFullYear();


  const months = [

    "Januari",

    "Februari",

    "Maret",

    "April",

    "Mei",

    "Juni",

    "Juli",

    "Agustus",

    "September",

    "Oktober",

    "November",

    "Desember"

  ];


  const monthSelect =
    document.getElementById(
      "monthFilter"
    );


  months.forEach(
    function(
      monthName,
      index
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        index + 1;


      option.textContent =
        monthName;


      if (
        index + 1 ===
        currentMonth
      ) {

        option.selected =
          true;

      }


      monthSelect.appendChild(
        option
      );

    }
  );


  const yearSelect =
    document.getElementById(
      "yearFilter"
    );


  for (
    let year =
      currentYear - 2;

    year <=
      currentYear + 2;

    year++
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      year;


    option.textContent =
      year;


    if (
      year ===
      currentYear
    ) {

      option.selected =
        true;

    }


    yearSelect.appendChild(
      option
    );

  }

}


/* =====================================================
   SET TODAY
===================================================== */

function setToday() {

  const today =
    new Date();


  const yyyy =
    today.getFullYear();


  const mm =
    String(
      today.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const dd =
    String(
      today.getDate()
    ).padStart(
      2,
      "0"
    );


  document.getElementById(
    "date"
  ).value =

    yyyy +
    "-" +
    mm +
    "-" +
    dd;

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

  try {

    const month =
      document.getElementById(
        "monthFilter"
      ).value;


    const year =
      document.getElementById(
        "yearFilter"
      ).value;


    const owner =
      document.getElementById(
        "ownerFilter"
      ).value;


    const result =
      await apiGet(
        "dashboard",
        {

          month:
            month,

          year:
            year,

          owner_id:
            owner

        }
      );


    if (
      result.success ===
      false
    ) {

      throw new Error(
        result.error
      );

    }


    document.getElementById(
      "income"
    ).textContent =
      formatRupiah(
        result.income
      );


    document.getElementById(
      "expense"
    ).textContent =
      formatRupiah(
        result.expense
      );


    document.getElementById(
      "balance"
    ).textContent =
      formatRupiah(
        result.balance
      );


    await loadTransactions();

  }

  catch (error) {

    console.error(
      error
    );


    showToast(
      "Gagal memuat dashboard."
    );

  }

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions() {

  const container =
    document.getElementById(
      "transactions"
    );


  container.innerHTML = `

    <div class="loading">

      Memuat transaksi...

    </div>

  `;


  try {

    const month =
      document.getElementById(
        "monthFilter"
      ).value;


    const year =
      document.getElementById(
        "yearFilter"
      ).value;


    const owner =
      document.getElementById(
        "ownerFilter"
      ).value;


    const data =
      await apiGet(
        "transactions",
        {

          month:
            month,

          year:
            year,

          owner_id:
            owner,

          type:
            "ALL"

        }
      );


    renderTransactions(
      data
    );

  }

  catch (error) {

    console.error(
      error
    );


    container.innerHTML = `

      <div class="empty">

        Gagal mengambil data transaksi.

      </div>

    `;

  }

}


/* =====================================================
   RENDER TRANSACTIONS
===================================================== */

function renderTransactions(
  data
) {

  const container =
    document.getElementById(
      "transactions"
    );


  container.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        Belum ada transaksi
        pada periode ini.

      </div>

    `;

    return;

  }


  data.forEach(
    function(item) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "transaction";


      const isIncome =
        item.type ===
        "INCOME";


      const ownerName =
        item.owner_id ===
        "U001"
          ? "Doni"
          : "Ellen";


      const amountClass =
        isIncome

          ? "transaction-income"

          : "transaction-expense";


      const sign =
        isIncome
          ? "+"
          : "-";


      wrapper.innerHTML = `

        <div
          class="transaction-left">

          <div
            class="transaction-title">

            ${escapeHTML(
              item.description ||
              "Tanpa deskripsi"
            )}

          </div>


          <div
            class="transaction-meta">

            ${item.date}

            ·

            ${ownerName}

            ·

            ${escapeHTML(
              item.account ||
              "Tidak ada account"
            )}

          </div>

        </div>


        <div
          class="transaction-right">

          <div
            class="transaction-amount
                   ${amountClass}">

            ${sign}

            ${formatRupiah(
              item.amount
            )}

          </div>


          <button
            class="btn-delete"
            onclick="deleteTransaction(
              '${item.transaction_id}'
            )">

            Hapus

          </button>

        </div>

      `;


      container.appendChild(
        wrapper
      );

    }
  );

}


/* =====================================================
   OPEN MODAL
===================================================== */

async function openTransactionModal(
  type
) {

  document.getElementById(
    "transactionModal"
  ).classList.add(
    "show"
  );


  document.getElementById(
    "transactionType"
  ).value =
    type;


  document.getElementById(
    "modalTitle"
  ).textContent =

    type ===
    "INCOME"

      ? "Tambah Pemasukan"

      : "Tambah Pengeluaran";


  setToday();


  await loadCategories(
    type
  );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeTransactionModal() {

  document.getElementById(
    "transactionModal"
  ).classList.remove(
    "show"
  );

}


/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories(
  type
) {

  const select =
    document.getElementById(
      "category"
    );


  select.innerHTML = `

    <option>
      Memuat kategori...
    </option>

  `;


  try {

    const data =
      await apiGet(
        "categories",
        {

          type:
            type

        }
      );


    select.innerHTML =
      "";


    if (
      !data ||
      data.length === 0
    ) {

      select.innerHTML = `

        <option value="">

          Tidak ada kategori

        </option>

      `;

      return;

    }


    data.forEach(
      function(item) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          item.category_id;


        option.textContent =

          item.icon +
          " " +
          item.category_name;


        select.appendChild(
          option
        );

      }
    );

  }

  catch (error) {

    console.error(
      error
    );


    select.innerHTML = `

      <option value="">

        Gagal memuat kategori

      </option>

    `;

  }

}


/* =====================================================
   SAVE TRANSACTION
===================================================== */

async function saveTransaction() {

  const button =
    document.getElementById(
      "saveButton"
    );


  try {

    const data = {

      date:
        document.getElementById(
          "date"
        ).value,

      type:
        document.getElementById(
          "transactionType"
        ).value,

      category_id:
        document.getElementById(
          "category"
        ).value,

      description:
        document.getElementById(
          "description"
        ).value.trim(),

      amount:
        document.getElementById(
          "amount"
        ).value,

      owner_id:
        document.getElementById(
          "owner"
        ).value,

      payment_method:
        document.getElementById(
          "paymentMethod"
        ).value,

      account:
        document.getElementById(
          "account"
        ).value.trim(),

      notes:
        document.getElementById(
          "notes"
        ).value.trim()

    };


    if (!data.date) {

      showToast(
        "Tanggal wajib diisi."
      );

      return;

    }


    if (
      !data.type
    ) {

      showToast(
        "Jenis transaksi belum dipilih."
      );

      return;

    }


    if (
      !data.category_id
    ) {

      showToast(
        "Kategori wajib dipilih."
      );

      return;

    }


    if (
      !data.amount ||
      Number(data.amount) <=
      0
    ) {

      showToast(
        "Nominal harus lebih dari 0."
      );

      return;

    }


    button.disabled =
      true;


    button.textContent =
      "Menyimpan...";


    const result =
      await apiPost({

        action:
          "addTransaction",

        data:
          data

      });


    if (
      result.success ===
      false
    ) {

      throw new Error(
        result.error
      );

    }


    showToast(
      "Transaksi berhasil disimpan."
    );


    clearForm();


    closeTransactionModal();


    await loadDashboard();

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "Gagal menyimpan transaksi:\n\n" +
      error.message
    );

  }

  finally {

    button.disabled =
      false;


    button.textContent =
      "Simpan";

  }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteTransaction(
  transactionId
) {

  const confirmation =
    confirm(
      "Apakah kamu yakin ingin menghapus transaksi ini?"
    );


  if (!confirmation) {

    return;

  }


  try {

    const result =
      await apiPost({

        action:
          "deleteTransaction",

        transaction_id:
          transactionId

      });


    if (
      result.success ===
      false
    ) {

      throw new Error(
        result.error
      );

    }


    showToast(
      "Transaksi berhasil dihapus."
    );


    await loadDashboard();

  }

  catch (error) {

    alert(
      "Gagal menghapus transaksi:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

  document.getElementById(
    "description"
  ).value =
    "";


  document.getElementById(
    "amount"
  ).value =
    "";


  document.getElementById(
    "paymentMethod"
  ).value =
    "";


  document.getElementById(
    "account"
  ).value =
    "";


  document.getElementById(
    "notes"
  ).value =

  setToday();

}


/* =====================================================
   RUPIAH
===================================================== */

function formatRupiah(
  number
) {

  return new Intl.NumberFormat(
    "id-ID",
    {

      style:
        "currency",

      currency:
        "IDR",

      maximumFractionDigits:
        0

    }
  ).format(
    Number(number) || 0
  );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.style.display =
    "block";


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.style.display =
          "none";

      },
      2500
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* =====================================================
   CLOSE MODAL WHEN CLICK OUTSIDE
===================================================== */

document
  .getElementById(
    "transactionModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeTransactionModal();

      }

    }
  );


</script>
